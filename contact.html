    <header>
        <nav>

            </ul>
        </nav>
    </header>
    <main>
        <form>
            <div>
                <label for="name">Введите имя</label>
                <input name="name" type="text" placeholder="Имя" minlength="2" required>
            </div>

            <div>
                <label for="email">Введите почту</label>
                <input name="email" type="email" placeholder="email" inputmode="email" required>
            </div>

            <div>
                <label for="tel">Введите телефон</label>
                <input name="tel" type="tel" placeholder="+375290000000" inputmode="tel">
            </div>

            <div>
                <label for="message">Введите сообщение</label>
                <textarea name="message" rows="3" placeholder="Введите сообщение" minlength="10" required></textarea>
            </div>

            <div>
                <input name="submit" type="submit" placeholder="Отправить" required>
            </div>
        </form>
    </main>
    <footer>
        <p>
            Все права защищены
        </p>
        <address>
            <p>
                Беларусь, ул.Пушкина, д.172, помещение 4
            </p>
        </address>
    </footer>
